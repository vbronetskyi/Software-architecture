version: '3'
services:
  facade-service:
    build: ./facade-service
    ports:
      - "8000:8000"
    depends_on:
      - logging-service
      - messages-service
      - config-server
      - kafka1
      - kafka2
      - kafka3
      - zookeeper
      - hazelcast-server1
      - hazelcast-server2

  logging-service:
    build: ./logging-service
    depends_on:
      - hazelcast-server1
      - hazelcast-server2
      - zookeeper
      - kafka1
      - kafka2
      - kafka3

  messages-service:
    build: ./messages-service
    depends_on:
      - zookeeper
      - kafka1
      - kafka2
      - kafka3

  config-server:
    build: ./config-server
    ports:
      - "8003:8003"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka1:
    image: confluentinc/cp-kafka:7.3.1
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper

  kafka2:
    image: confluentinc/cp-kafka:7.3.1
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    ports:
      - "9093:9092"
    depends_on:
      - zookeeper

  kafka3:
    image: confluentinc/cp-kafka:7.3.1
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    ports:
      - "9094:9092"
    depends_on:
      - zookeeper

  hazelcast-server1:
    image: hazelcast/hazelcast:5.5.0
    ports:
      - "5701:5701"

  hazelcast-server2:
    image: hazelcast/hazelcast:5.5.0
    ports:
      - "5702:5701"
